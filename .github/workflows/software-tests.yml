name: Software toolchain tests

on:
  push:
    paths:
      - 'final_cpu/tools/la32asm/**'
      - '.github/workflows/software-tests.yml'
  pull_request:
    paths:
      - 'final_cpu/tools/la32asm/**'
      - '.github/workflows/software-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: final_cpu/tools/la32asm/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r final_cpu/tools/la32asm/requirements.txt
      - name: Run software tests (hardware not exercised)
        working-directory: final_cpu/tools/la32asm
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
